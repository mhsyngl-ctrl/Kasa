name: Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true → Pages kapalıysa açar, ayarlara girmeye gerek kalmaz
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: dagitim
        uses: actions/deploy-pages@v4
