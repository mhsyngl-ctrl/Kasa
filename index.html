<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kasa">
<meta name="theme-color" content="#0f1621">
<title>Kasa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="https://cuujupeindodpsdjcivm.supabase.co/functions/v1/kasa/simge.png">
<style>
:root{
  --zemin:#0f1621; --kart:#182233; --kart2:#1e2a3d; --cizgi:#2a3850;
  --yazi:#e8eef7; --soluk:#8b9bb4; --daha-soluk:#5f6f88;
  --mavi:#4a9eff; --kirmizi:#ff6b5e; --turuncu:#ffa447;
  --yesil:#3ecf8e; --sari:#ffd166;
  --ust:env(safe-area-inset-top); --alt:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--zemin);color:var(--yazi);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body{padding-top:var(--ust);padding-bottom:calc(24px + var(--alt))}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.gizli{display:none!important}
.sayi{font-variant-numeric:tabular-nums;letter-spacing:-.5px}

/* ---------- Giriş ---------- */
#giris{position:fixed;inset:0;z-index:100;background:var(--zemin);
  display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
#giris h1{font-size:36px;margin:0 0 6px;letter-spacing:-1px}
#giris p{color:var(--soluk);margin:0 0 32px;font-size:15px}
#giris input{width:100%;padding:15px 16px;margin-bottom:10px;border-radius:14px;
  background:var(--kart);border:1px solid var(--cizgi)}
#giris button{width:100%;padding:16px;border-radius:14px;background:var(--mavi);
  color:#062038;font-weight:700;margin-top:8px}
.hata{color:var(--kirmizi);font-size:13px;min-height:18px;margin-top:12px}

/* ---------- Başlık ---------- */
header{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;min-height:52px}
header .orta{flex:1;text-align:center;font-weight:600;font-size:16px}
.yuvarlak{width:40px;height:40px;border-radius:50%;background:var(--kart);
  display:grid;place-items:center;font-size:17px;flex-shrink:0;color:var(--soluk)}
.yuvarlak:active{background:var(--kart2)}
.geri{display:flex;align-items:center;gap:4px;color:var(--mavi);font-size:16px;
  padding:8px 10px 8px 4px;margin-left:-4px}

/* ---------- Dönem seçici ---------- */
.donem{display:flex;gap:2px;background:var(--kart2);border-radius:11px;padding:3px;
  margin:4px 16px 20px}
.donem button{flex:1;padding:7px 0;border-radius:9px;font-size:13px;color:var(--soluk)}
.donem button.aktif{background:var(--kart);color:var(--yazi);font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* ---------- Ana rakam ---------- */
.hero{padding:8px 20px 24px}
.hero .etiket{font-size:12px;letter-spacing:1.4px;color:var(--soluk);
  text-transform:uppercase;font-weight:600}
.hero .donemAdi{font-size:13px;color:var(--daha-soluk);margin-top:3px}
.hero .rakam{font-size:46px;font-weight:700;color:var(--yesil);margin-top:10px;
  line-height:1.05}
.hero .rakam.bos{color:var(--daha-soluk);font-size:38px}
.hero .zil{font-size:13px;color:var(--sari);margin-top:8px}
.hero .not{font-size:12px;color:var(--daha-soluk);margin-top:12px;line-height:1.4}

/* ---------- Liste ---------- */
.liste{margin:0 16px;background:var(--kart);border-radius:16px;overflow:hidden}
.satir{display:flex;align-items:center;gap:13px;padding:15px 16px;
  border-bottom:1px solid var(--cizgi)}
.satir:last-child{border-bottom:0}
.satir.dokunulur:active{background:var(--kart2)}
.satir .simge{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.satir .orta{flex:1;min-width:0}
.satir .ad{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.satir .alt{font-size:12.5px;color:var(--soluk);margin-top:2px}
.satir .sag{text-align:right;font-weight:700;font-size:17px;white-space:nowrap;
  color:var(--yesil)}
.satir .sag.pasif{color:var(--daha-soluk);font-weight:500}
.satir .ok{color:var(--daha-soluk);font-size:18px;flex-shrink:0;margin-left:-4px}

.baslik{padding:24px 20px 10px;font-size:12px;letter-spacing:1.2px;
  color:var(--soluk);text-transform:uppercase;font-weight:600;
  display:flex;justify-content:space-between;align-items:baseline}
.baslik .sag{font-size:12px;letter-spacing:0;text-transform:none;color:var(--daha-soluk)}

.bos-durum{text-align:center;padding:40px 32px;color:var(--daha-soluk);font-size:14px;
  line-height:1.5}
.bos-durum b{display:block;color:var(--soluk);font-size:16px;margin-bottom:8px}
.yukleniyor{text-align:center;padding:60px;color:var(--daha-soluk)}

/* ---------- Menü ---------- */
#menu{position:fixed;inset:0;z-index:60;background:var(--zemin);
  padding-top:var(--ust);transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.32,.72,0,1)}
#menu.acik{transform:translateX(0)}
#menu h2{padding:18px 20px 6px;font-size:22px;margin:0;letter-spacing:-.5px}
#menu .kim{padding:0 20px 18px;color:var(--daha-soluk);font-size:13px}

/* ---------- Kayıt paneli ---------- */
#perde{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;opacity:0;
  pointer-events:none;transition:opacity .2s}
#perde.acik{opacity:1;pointer-events:auto}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:75;background:var(--kart);
  border-radius:22px 22px 0 0;padding:6px 0 calc(10px + var(--alt));
  transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);
  max-height:92vh;overflow-y:auto;border-top:3px solid var(--mavi)}
#panel.acik{transform:translateY(0)}
#panel.gider{border-top-color:var(--kirmizi)}
#panel.transfer{border-top-color:var(--turuncu)}
.tutamac{width:38px;height:4px;border-radius:2px;background:var(--cizgi);margin:6px auto 10px}
.sekmeler{display:flex;gap:6px;padding:0 14px 12px}
.sekmeler button{flex:1;padding:10px;border-radius:10px;background:var(--kart2);
  font-weight:600;font-size:14px;color:var(--soluk)}
.sekmeler button.aktif{background:var(--mavi);color:#062038}
#panel.gider .sekmeler button.aktif{background:var(--kirmizi);color:#3a0b06}
#panel.transfer .sekmeler button.aktif{background:var(--turuncu);color:#3a1f02}
.alan{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-top:1px solid var(--cizgi)}
.alan label{width:86px;font-size:13px;color:var(--soluk);flex-shrink:0}
.alan input,.alan select{flex:1;background:none;border:0;padding:2px 0;min-width:0}
.alan select{appearance:none;color:var(--yazi)}
#tutarGoster{font-size:34px;font-weight:700;text-align:right;padding:10px 18px 4px;
  font-variant-numeric:tabular-nums;letter-spacing:-1px}
.odendi-satir{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-top:1px solid var(--cizgi)}
.odendi-satir .yazi{font-size:13px}
.odendi-satir .yazi small{display:block;color:var(--daha-soluk);font-size:11px}
.anahtar{width:50px;height:29px;border-radius:15px;background:var(--cizgi);
  position:relative;transition:background .2s;flex-shrink:0}
.anahtar.acik{background:var(--yesil)}
.anahtar i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;transition:left .2s}
.anahtar.acik i{left:24px}
.tuslar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:12px 14px 4px}
.tuslar button{padding:15px 0;border-radius:12px;background:var(--kart2);
  font-size:21px;font-weight:500}
.tuslar button:active{background:var(--cizgi)}
.tuslar .kaydet{grid-row:span 2;background:var(--mavi);color:#062038;font-size:15px;
  font-weight:700}
#panel.gider .tuslar .kaydet{background:var(--kirmizi);color:#3a0b06}
#panel.transfer .tuslar .kaydet{background:var(--turuncu);color:#3a1f02}
.tuslar .kaydet:disabled{opacity:.4}
</style>
</head>
<body>

<div id="giris">
  <h1>Kasa</h1>
  <p>Teslim edilen paranın tek yeri.</p>
  <input id="ePosta" type="email" placeholder="E-posta" autocomplete="username"
         autocapitalize="off" spellcheck="false">
  <input id="parola" type="password" placeholder="Parola" autocomplete="current-password">
  <button id="girisDugme">Giriş yap</button>
  <div class="hata" id="girisHata"></div>
</div>

<div id="uygulama" class="gizli">
  <header id="baslik"></header>
  <main id="icerik"><div class="yukleniyor">Yükleniyor…</div></main>
</div>

<div id="menu">
  <h2>Kasa</h2>
  <div class="kim" id="menuKim"></div>
  <div id="menuIcerik"></div>
</div>

<div id="perde"></div>
<div id="panel">
  <div class="tutamac"></div>
  <div class="sekmeler">
    <button data-tip="gelir">GELİR</button>
    <button data-tip="gider">GİDER</button>
    <button data-tip="transfer">TRANSFER</button>
  </div>
  <div id="tutarGoster">0</div>
  <div class="alan"><label>Hesap</label><select id="fHesap"></select></div>
  <div class="alan" id="hedefAlan"><label>Aktarılan</label><select id="fHedef"></select></div>
  <div class="alan"><label>Kategori</label><select id="fKategori"></select></div>
  <div class="alan"><label>Tarih</label><input id="fTarih" type="date"></div>
  <div class="alan"><label>Açıklama</label><input id="fAciklama" placeholder="isteğe bağlı"></div>
  <div class="odendi-satir">
    <div class="yazi"><b id="odendiBaslik">Parası alındı</b>
      <small>Kapatırsan bekleyen olarak durur</small></div>
    <button class="anahtar acik" id="fOdendi"><i></i></button>
  </div>
  <div class="alan gizli" id="vadeAlan"><label>Vade</label><input id="fVade" type="date"></div>
  <div class="tuslar">
    <button data-t="1">1</button><button data-t="2">2</button><button data-t="3">3</button>
    <button class="kaydet" id="kaydetDugme">KAYDET</button>
    <button data-t="4">4</button><button data-t="5">5</button><button data-t="6">6</button>
    <button data-t="7">7</button><button data-t="8">8</button><button data-t="9">9</button>
    <button data-t=",">,</button>
    <button data-t="0">0</button><button data-t="00">00</button>
    <button data-t="sil">⌫</button><button id="panelKapat">Vazgeç</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
<script src="uygulama.js?s=2"></script>
</body>
</html>
