<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasa">
<meta name="theme-color" content="#ffffff">
<title>Kasa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="https://cuujupeindodpsdjcivm.supabase.co/functions/v1/kasa/simge.png">
<style>
:root{
  --zemin:#ffffff; --kart:#F5F6F8; --kart2:#EDEFF3; --cizgi:#E4E7EC;
  --yazi:#1C2638; --soluk:#5A6473; --silik:#8A93A3;
  --yesil:#0F7A52; --sari:#8A6A3D; --mavi:#1F4E8C; --kirmizi:#C0392B;
  --ust:env(safe-area-inset-top); --alt:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--zemin);color:var(--yazi);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding:var(--ust) 0 calc(28px + var(--alt))}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.gizli{display:none!important}
.sayi{font-variant-numeric:tabular-nums;letter-spacing:-.6px}

/* giriş */
#giris{position:fixed;inset:0;z-index:50;background:var(--zemin);
  display:flex;flex-direction:column;justify-content:center;padding:32px 24px}
#giris h1{font-size:38px;margin:0 0 6px;letter-spacing:-1.2px}
#giris p{color:var(--soluk);margin:0 0 34px}
#giris input{width:100%;padding:15px 16px;margin-bottom:10px;border-radius:14px;
  background:var(--kart);border:1px solid var(--cizgi)}
#giris button{width:100%;padding:16px;border-radius:14px;background:var(--mavi);
  color:#ffffff;font-weight:700;margin-top:8px}
.hata{color:var(--kirmizi);font-size:13px;min-height:18px;margin-top:12px}

/* üst satır */
.ust{display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 18px}
.ust .marka{font-size:17px;font-weight:700;letter-spacing:-.3px}
.ust button{width:38px;height:38px;border-radius:50%;background:var(--kart);
  color:var(--soluk);font-size:16px;display:grid;place-items:center}
.ust button:active{background:var(--kart2)}

/* dönem */
.donem{display:flex;gap:2px;background:var(--kart2);border-radius:11px;padding:3px;
  margin:0 20px 26px}
.donem button{flex:1;padding:8px 0;border-radius:9px;font-size:13.5px;color:var(--soluk)}
.donem button.aktif{background:var(--kart);color:var(--yazi);font-weight:600}

/* ana rakam */
.hero{padding:0 20px 28px}
.hero .etiket{font-size:11.5px;letter-spacing:1.5px;color:var(--soluk);
  text-transform:uppercase;font-weight:600}
.hero .rakam{font-size:48px;font-weight:700;color:var(--yesil);
  margin:10px 0 4px;line-height:1}
.hero .rakam.bos{color:var(--silik)}
.hero .alt{font-size:13px;color:var(--silik)}
.hero .zil{font-size:13px;color:var(--sari);margin-top:10px}
.hero .acik{font-size:13px;color:var(--soluk);margin-top:10px}
.hero .red{font-size:13px;color:var(--kirmizi);margin-top:8px}
.markalar .marka .not.red{color:var(--kirmizi)}

/* marka kutuları */
.markalar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 28px}
.markalar .marka{background:var(--kart);border-radius:16px;padding:15px 14px 16px}
.markalar .marka .ikon{font-size:24px;line-height:1}
.markalar .marka .ad{font-size:13.5px;color:var(--soluk);margin:9px 0 6px;font-weight:500}
.markalar .marka .tutar{font-size:21px;font-weight:700;color:var(--yesil)}
.markalar .marka .tutar.bos{color:var(--silik);font-weight:500}
.markalar .marka .not{font-size:11.5px;color:var(--silik);margin-top:5px}

/* son teslimler */
.baslik{padding:0 20px 10px;font-size:11.5px;letter-spacing:1.5px;color:var(--soluk);
  text-transform:uppercase;font-weight:600;display:flex;justify-content:space-between}
.baslik span:last-child{letter-spacing:0;text-transform:none;color:var(--silik);
  font-weight:400}
.liste{margin:0 20px;background:var(--kart);border-radius:16px;overflow:hidden}
.satir{display:flex;align-items:center;gap:12px;padding:13px 15px;
  border-bottom:1px solid var(--cizgi)}
.satir:last-child{border-bottom:0}
.satir .ikon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.satir .orta{flex:1;min-width:0}
.satir .gun{font-weight:600;font-size:15px}
.satir .haf{font-size:12px;color:var(--silik);margin-top:1px}
.satir .tut{font-weight:700;font-size:16px;color:var(--yesil);white-space:nowrap}

.bos-durum{margin:0 20px;background:var(--kart);border-radius:16px;
  padding:34px 24px;text-align:center;color:var(--silik);font-size:13.5px;
  line-height:1.5}
.bos-durum b{display:block;color:var(--soluk);font-size:15px;margin-bottom:6px}
.yukleniyor{text-align:center;padding:70px;color:var(--silik)}

/* alt bilgi */
.dip{text-align:center;padding:30px 20px 0;font-size:12px;color:var(--silik)}
.dip button{color:var(--soluk);text-decoration:underline;font-size:12px;margin-top:10px}
</style>
</head>
<body>

<div id="giris">
  <h1>Kasa</h1>
  <p>Teslim edilen paranın tek yeri.</p>
  <input id="ePosta" type="email" placeholder="E-posta" autocomplete="username"
         autocapitalize="off" spellcheck="false">
  <input id="parola" type="password" placeholder="Parola" autocomplete="current-password">
  <button id="girisDugme">Giriş yap</button>
  <div class="hata" id="girisHata"></div>
</div>

<div id="uygulama" class="gizli">
  <div class="ust">
    <div class="marka">Kasa</div>
    <button id="yenile" title="Yenile">↻</button>
  </div>
  <div id="icerik"><div class="yukleniyor">Yükleniyor…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
<script src="uygulama.js?s=6"></script>
</body>
</html>
